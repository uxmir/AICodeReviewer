services:
  app:
    image: aicodereviewer-app
    container_name: ai-code-reviewer-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - INNGEST_BASE_URL=http://inngest:8288
    depends_on:
      - inngest
    networks:
      - app-network

  inngest:
    image: inngest/inngest:latest
    container_name: inngest-server
    restart: unless-stopped
    command: "inngest dev -u http://app:3000/api/ingest"
    ports:
      - "8288:8288"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge